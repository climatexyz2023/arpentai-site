<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorités centenaires — France · Espagne · Italie · Portugal</title>
<style>
  :root{
    --parchemin:#F4ECD6;
    --encre:#2B2620;
    --rouge:#7C2020;
    --ocre:#8C6B3F;
    --parchemin-fonce:#EBE0C4;
    --filet:rgba(43,38,32,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--parchemin);
    color:var(--encre);
    line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* ——— En-tête ——— */
  header{padding:56px 0 30px;border-bottom:2px solid var(--encre);}
  .surtitre{
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ocre);
    margin-bottom:14px;
  }
  h1{font-size:clamp(30px,4.6vw,50px);font-weight:normal;line-height:1.12;max-width:20ch;}
  h1 em{font-style:italic;color:var(--rouge);}
  .chapeau{margin-top:18px;max-width:64ch;font-size:17px;color:var(--encre);}
  .chapeau .pdm{color:var(--rouge);}

  /* ——— Bandeau de cadrage ——— */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    border-bottom:1px solid var(--filet);
  }
  .stat{padding:22px 18px 20px;border-right:1px solid var(--filet);}
  .stat:last-child{border-right:none;}
  .stat b{display:block;font-size:30px;font-weight:normal;font-variant-numeric:oldstyle-nums;}
  .stat span{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ocre);}

  /* ——— Filtres ——— */
  .filtres{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;}
  .groupe{display:flex;flex-direction:column;gap:6px;}
  .groupe label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    font-family:inherit;font-size:14.5px;background:transparent;color:var(--encre);
    border:1px solid var(--filet);padding:5px 13px;cursor:pointer;border-radius:2px;
  }
  .pill:hover{border-color:var(--encre);}
  .pill.actif{background:var(--rouge);border-color:var(--rouge);color:var(--parchemin);}
  select,input[type=search]{
    font-family:inherit;font-size:15px;color:var(--encre);
    background:transparent;border:none;border-bottom:1px solid var(--encre);
    padding:5px 2px;min-width:190px;outline:none;
  }
  .compteur{font-size:13.5px;color:var(--ocre);font-style:italic;margin-left:auto;padding-bottom:6px;}

  /* ——— Colophons ——— */
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;
    background:var(--filet);border:1px solid var(--filet);margin:18px 0 8px;}
  .maison{background:var(--parchemin);padding:24px 22px 20px;display:flex;flex-direction:column;gap:10px;}
  .maison:hover{background:var(--parchemin-fonce);}
  .ligne1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .annee{color:var(--rouge);font-size:15px;font-variant-numeric:oldstyle-nums;white-space:nowrap;}
  .annee::before{content:"¶ ";}
  .pays-tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre);}
  .nom{font-size:21px;line-height:1.2;}
  .lieu{font-size:13.5px;font-style:italic;color:var(--ocre);margin-top:-6px;}
  .sf{font-size:15px;}
  .acts{font-size:13.5px;color:#4a4238;}
  .meta{
    margin-top:auto;padding-top:12px;border-top:1px solid var(--filet);
    display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:13px;
  }
  .meta div span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);}
  .meta b{font-weight:normal;font-variant-numeric:oldstyle-nums;}
  .ctrl{display:inline-block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--ocre);color:var(--ocre);padding:1px 8px;border-radius:2px;}
  .ctrl.familial{border-color:var(--rouge);color:var(--rouge);}
  .age{white-space:nowrap;}
  .exc{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ocre);margin:2px 0 0;}
  .vues{display:flex;gap:10px;margin:20px 0 4px;}
  .vues .pill{font-size:14.5px;padding:9px 18px;}
  .filieres{margin-top:24px;border-top:3px double var(--rouge);padding-top:22px;}
  .filieres h2{font-size:26px;font-weight:normal;color:var(--rouge);}
  .flIntro{max-width:70ch;font-size:15px;color:var(--ocre);font-style:italic;margin:8px 0 22px;}
  .flCat{margin-bottom:26px;}
  .flCat h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre);
    font-weight:normal;border-bottom:1px solid var(--filet);padding-bottom:6px;margin-bottom:2px;}
  .flRow{display:grid;grid-template-columns:minmax(0,1fr) 150px 300px;gap:14px;
    padding:9px 0;border-bottom:1px dotted var(--filet);font-size:14.5px;align-items:baseline;}
  .flRow .flNom{font-weight:bold;}
  .flRow .flNom .pays-tag{margin-left:8px;font-weight:normal;}
  .flRow .flDebut{color:var(--encre);}
  .flRow .flRest{color:var(--rouge);}
  .ucRow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 260px;gap:14px;
    padding:10px 0;border-bottom:1px dotted var(--filet);font-size:14px;}
  .ucRow .ucNom b{display:block;}
  .ucRow .ucNom span{font-size:13.5px;}
  .ucRow .ucAut{color:var(--encre);font-size:13.5px;}
  .ucRow .ucMeca{color:var(--rouge);font-size:13.5px;}
  .ucHead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 260px;gap:14px;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);padding:7px 0 3px;}
  @media(max-width:760px){ .ucRow,.ucHead{grid-template-columns:1fr;gap:3px;} .ucHead{display:none;} }
  .flHead{display:grid;grid-template-columns:minmax(0,1fr) 150px 300px;gap:14px;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);padding:7px 0 3px;}
  @media(max-width:760px){
    .flRow,.flHead{grid-template-columns:1fr;gap:2px;}
    .flHead{display:none;}
  }
  .plier{
    font-family:inherit;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;border:none;border-top:1px solid var(--filet);
    color:var(--ocre);cursor:pointer;padding:9px 0 0;margin-top:10px;text-align:left;width:100%;
  }
  .plier:hover{color:var(--rouge);}
  .detail{display:none;margin-top:8px;font-size:13.5px;line-height:1.5;}
  .maison.ouvert .detail{display:block;}
  .detail h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);
    font-weight:normal;margin:12px 0 5px;}
  .detail ul{list-style:none;}
  .detail li{margin-bottom:4px;padding-left:13px;position:relative;}
  .detail li::before{content:"·";position:absolute;left:2px;color:var(--ocre);}
  .agentique{border-left:2px solid var(--rouge);padding:2px 0 2px 11px;margin-top:12px;}
  .agentique h3{color:var(--rouge);margin-top:0;}

  /* ——— Pied ——— */
  footer{padding:26px 0 60px;font-size:13px;color:#4a4238;border-top:2px solid var(--encre);margin-top:26px;}
  footer p{max-width:80ch;margin-bottom:8px;}
  footer .flag{color:var(--rouge);}
  .vide{padding:60px 0;text-align:center;font-style:italic;color:var(--ocre);}
  @media(max-width:640px){.stat b{font-size:24px;}.filtres{gap:14px;}}
</style>

"Longines":{f:["1832 — le comptoir d'Auguste Agassiz à Saint-Imier","1878-1912 — le chronométrage sportif, le fil d'arrivée électrique","Chaque montre retrouvable par numéro de série depuis 1867"],s:["Chronométrage : la mesure du temps sportif","Calibres de manufacture historiques","Archives : l'identification par numéro"],a:"Son registre par numéro de série depuis 1867 est un précédent d'identité persistante d'objet : exactement la couche que le colophon généralise — Longines l'a fait un siècle et demi avant la lettre."},

"Audemars Piguet":{f:["1875 — Jules Audemars et Edward Piguet au Brassus","1972 — la Royal Oak de Gérald Genta : l'acier au prix de l'or","Toujours aux mains des familles fondatrices"],s:["Grande complication de la vallée de Joux","Finition : le Tapisserie, les angles rentrants","Le musée-spirale au village"],a:"La Royal Oak a inversé la hiérarchie des matériaux par le seul dessin et la seule finition : preuve que la valeur est dans la main et le nom, pas la matière — l'argument central du manifeste, en acier."},

"Kudelski":{f:["1951 — Stefan Kudelski, étudiant réfugié polonais, crée le Nagra à Lausanne","1958-1977 — le son du cinéma mondial, Oscars techniques","Années 1990 — l'accès conditionnel : compter les lectures"],s:["Enregistrement : le Nagra, référence du son synchrone","Accès conditionnel : cartes, chiffrement","Comptage certifié des usages"],a:"Du magnétophone au comptage d'audience, Kudelski a toujours vendu la même chose : la preuve de ce qui a été lu. Le certificateur-né du droit de lecture — c'est exactement son rôle dans la doctrine."},
"Augarten":{f:["1718 — deuxième manufacture de porcelaine d'Europe (Du Paquier)","1744 — manufacture impériale","1923 — refondation au palais Augarten"],s:["Porcelaine viennoise : pâte, peinture à la main","Motifs : rose viennoise, Biedermeier, Hoffmann","Figurines de l'École espagnole d'équitation"],a:"Trois siècles de motifs viennois, du baroque à la Sécession : une grammaire ornementale datée — la lignée du décor comme corpus attribué, pas comme style aspirable."},
"Riedel":{f:["1756 — verriers de Bohême ; onze générations","1973 — la série Sommeliers : le verre dessiné pour le cépage","La dégustation comparative comme démonstration"],s:["Formes : le rapport forme-arôme-palais","Soufflage machine et bouche","Ateliers de dégustation comparée"],a:"La thèse Riedel — la forme change la perception — est testable et testée : un protocole sensoriel reproductible, base d'agents sommeliers qui expliquent pourquoi, verre en main."},

"Hotel Sacher":{f:["1832 — Franz Sacher, apprenti de seize ans, improvise la torte pour Metternich","1876 — son fils Eduard ouvre l'hôtel","1954-1963 — le procès de la « véritable » Sachertorte"],s:["La torte : recette originale au coffre, glaçage en trois eaux","Le service viennois","La culture du Kaffeehaus"],a:"Sept ans de procès pour le mot « original » : la jurisprudence de l'authenticité culinaire — le cas d'école juridique du signé-ou-anonyme, tranché au tribunal avant nous."},

"Brasserie Artois":{f:["1366 — Den Hoorn, brasserie attestée à Louvain","1717 — Sébastien Artois, maître brasseur, l'achète","1926 — Stella, la pils de Noël"],s:["Brassage pils : malt, houblon saaz, fermentation basse","Le rituel de service en neuf étapes","Six siècles de continuité de site"],a:"Le rituel en neuf étapes est un protocole gestuel formalisé : déjà prêt pour l'agent de formation — la question est de savoir s'il restera signé Louvain ou dilué dans la plateforme."},

"Kosta Boda":{f:["1742 — Kosta, plus ancienne verrerie de Suède en activité","XXᵉ s. — le royaume du cristal (Glasriket)","Les artistes intégrés à la verrerie"],s:["Soufflage : les équipes de fusion du Småland","Verre d'art : couleurs, inclusions","Le hyttsill : le repas à la verrerie"],a:"Le hyttsill — la verrerie comme lieu social du village : le savoir-faire inséparable de sa communauté. Exactement ce que « local par nature » veut dire : à documenter comme écosystème, pas comme technique."},

"Ericsson":{f:["1876 — l'atelier de réparation télégraphique de Lars Magnus Ericsson","1878 — son premier téléphone","De la 2G à la 5G : les brevets essentiels"],s:["Réseaux : radio, cœur de réseau","Brevets essentiels : licences FRAND","60 000 brevets"],a:"Le régime FRAND — licence équitable des brevets essentiels : le précédent juridique le plus proche du droit de lecture. Un standard ouvert, payé par tous à tarif raisonnable : Ericsson vit déjà dans le monde qu'Incunabula décrit."},

"Helly Hansen":{f:["1877 — le capitaine Helly Juell Hansen huile ses toiles à Moss","1949 — Helox, le premier imperméable soudé","L'équipementier des mers du Nord"],s:["La toile huilée : l'étanchéité d'origine","Imper-respirant, flottabilité","Tests en conditions polaires et offshore"],a:"Cent quarante ans de retours d'usage en mer du Nord : la base de données de la survie en conditions réelles — le vêtement comme capteur d'environnement extrême, à faire parler sous le nom du capitaine."},

"Iittala":{f:["1881 — la verrerie d'Iittala","1936 — le vase Savoy d'Alvar et Aino Aalto","La flamme rouge du logo"],s:["Soufflage au moule : le Savoy exige sept artisans synchronisés","Verre pressé coloré (Kastehelmi)","Rééditions permanentes"],a:"Le vase Aalto se souffle à sept artisans dans une chorégraphie de trente secondes, transmise depuis 1936 : le geste collectif comme unité de savoir — que la captation doit saisir en équipe, pas en solo."},

"Petrof":{f:["1864 — Antonín Petrof, formé à Vienne, revient à Hradec","1948 — nationalisé ; 1991 — rendu à la famille","5ᵉ génération, plus grand facteur de pianos d'Europe"],s:["Table d'harmonie : épicéa de résonance","Harmonisation : le « son rond » européen","Mécaniques, cordes, vernis"],a:"L'harmonisation — piquer les marteaux jusqu'au son voulu — est un dialogue oreille-main : la donnée psychoacoustique incarnée. Confisqué 43 ans puis rendu : le nom a survécu à l'État. Kripke, version tchèque."},

const CATSU = ["percevoir","vivant","juger","transmettre","authentifier","territoire","creer","servir"];

let fPays = "TOUS", fCtrl = "TOUS", fQ = "", fTri = "annee", fVue = "maisons";

function ctrlFamille(c){
  if(/état|publique|public|ville|salariés/i.test(c)) return "Public";
  if(/fondation/i.test(c)) return "Fondation";
  if(/familial|commandite/i.test(c)) return "Familial";
  if(/groupe|fonds/i.test(c)) return "Groupe";
  return "Indépendant";
}

function fmtCA(m){
  if(m==null) return "n.p.";
  if(m>=1000) return (m/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" Md€";
  return m.toLocaleString("fr-FR")+" M€";
}

function pills(el, valeurs, actif, cb){
  el.innerHTML = "";
  valeurs.forEach(v=>{
    const b=document.createElement("button");
    b.className="pill"+(v[0]===actif?" actif":"");
    b.textContent=v[1];
    b.onclick=()=>cb(v[0]);
    el.appendChild(b);
  });
}

function detailHTML(m){
  const d = DETAILS[m.nom];
  if(!d) return "";
  return `<button class="plier" onclick="const c=this.closest('.maison');c.classList.toggle('ouvert');this.textContent=c.classList.contains('ouvert')?L.replier:L.plier">${L.plier}</button>
  <div class="detail">
    <h3>${L.hFaits}</h3>
    <ul>${d.f.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>${L.hSF}</h3>
    <ul>${d.s.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="agentique">
      <h3>${L.hMonde}</h3>
      <p>${d.a}</p>
    </div>
  </div>`;
}

function rendre(){
  L = I18N[lang];

  /* Chrome i18n */
  document.getElementById("surtitre").textContent = L.surtitre;
  document.getElementById("titre").innerHTML = L.titre;
  document.getElementById("chapeau").innerHTML = L.chapeau(DATA.length);
  document.getElementById("lblLang").textContent = L.lblLang;
  document.getElementById("lblPays").textContent = L.lblPays;
  document.getElementById("lblCtrl").textContent = L.lblCtrl;
  document.getElementById("lblTri").textContent = L.lblTri;
  document.getElementById("lblQ").textContent = L.lblQ;
  document.getElementById("q").placeholder = L.phQ;
  document.getElementById("note1").innerHTML = L.note1;
  document.getElementById("note2").innerHTML = L.note2;
  document.getElementById("vide").textContent = L.vide;

  /* Onglets */
  const bM = document.getElementById("vueM"), bF = document.getElementById("vueF"), bS = document.getElementById("vueS"), bU = document.getElementById("vueU");
  bU.textContent = L.vueU + " (" + USECASES.length + ")";
  bU.className = "pill" + (fVue==="usecases" ? " actif" : "");
  bU.onclick = ()=>{fVue="usecases";rendre();};
  bM.textContent = L.vueM + " (" + DATA.length + ")";
  bF.textContent = L.vueF + " (" + FILIERES.length + ")";
  bS.textContent = L.vueS + " (" + SAVOIRS.length + ")";
  bM.className = "pill" + (fVue==="maisons" ? " actif" : "");
  bF.className = "pill" + (fVue==="filieres" ? " actif" : "");
  bS.className = "pill" + (fVue==="savoirs" ? " actif" : "");
  bM.onclick = ()=>{fVue="maisons";rendre();};
  bF.onclick = ()=>{fVue="filieres";rendre();};
  bS.onclick = ()=>{fVue="savoirs";rendre();};
  const enMaisons = fVue==="maisons";

  const tri = document.getElementById("tri");
  tri.innerHTML = `<option value="annee">${L.triAnc}</option><option value="ca">${L.triCA}</option><option value="nom">${L.triNom}</option>`;
  tri.value = fTri;

  /* Pays : select trié par nombre de maisons */
  const parPays = {};
  DATA.forEach(m=>parPays[m.pays]=(parPays[m.pays]||0)+1);
  const codes = Object.keys(parPays).sort((a,b)=>parPays[b]-parPays[a]);
  const sp = document.getElementById("selPays");
  sp.innerHTML = `<option value="TOUS">${L.tous} (${DATA.length})</option>` +
    codes.map(c=>`<option value="${c}">${L.pays[c]} (${parPays[c]})</option>`).join("");
  sp.value = fPays;
  sp.onchange = e=>{fPays=e.target.value;rendre();};

  pills(document.getElementById("pillsCtrl"),
    [["TOUS",L.tous],["Familial",L.ctrl["Familial"]],["Indépendant",L.ctrl["Indépendant"]],
     ["Groupe",L.ctrl["Groupe"]],["Fondation",L.ctrl["Fondation"]],["Public",L.ctrl["Public"]]],
    fCtrl, v=>{fCtrl=v;rendre();});

  let liste = DATA.filter(m=>{
    if(fPays!=="TOUS" && m.pays!==fPays) return false;
    if(fCtrl!=="TOUS" && ctrlFamille(m.ctrl)!==fCtrl) return false;
    if(fQ){
      const t=(m.nom+" "+m.ville+" "+m.sf+" "+m.acts).toLowerCase();
      if(!t.includes(fQ)) return false;
    }
    return true;
  });
  if(fTri==="annee") liste.sort((a,b)=>a.annee-b.annee);
  if(fTri==="ca") liste.sort((a,b)=>(b.ca??-1)-(a.ca??-1));
  if(fTri==="nom") liste.sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));

  /* Stats sur la sélection */
  const n=liste.length;
  const ageMoy = n? Math.round(liste.reduce((s,m)=>s+(NOW-m.annee),0)/n) : 0;
  const caTot = liste.reduce((s,m)=>s+(m.ca||0),0);
  const pctFam = n? Math.round(100*liste.filter(m=>ctrlFamille(m.ctrl)==="Familial").length/n) : 0;
  const pctGrp = n? Math.round(100*liste.filter(m=>ctrlFamille(m.ctrl)==="Groupe").length/n) : 0;
  const plusAncienne = n? liste.reduce((a,b)=>a.annee<b.annee?a:b) : null;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${n}</b><span>${L.stMaisons}</span></div>
    <div class="stat"><b>${ageMoy} ${L.ans}</b><span>${L.stAge}</span></div>
    <div class="stat"><b>${pctFam} %</b><span>${L.stFam}</span></div>
    <div class="stat"><b>${pctGrp} %</b><span>${L.stGrp}</span></div>
    <div class="stat"><b>≈ ${fmtCA(caTot)}</b><span>${L.stCA}</span></div>
    <div class="stat"><b>${plusAncienne?plusAncienne.annee:"—"}</b><span>${plusAncienne?(L.stDoy+plusAncienne.nom):""}</span></div>`;

  document.getElementById("compteur").textContent = n+" "+L.cptr;

  const g=document.getElementById("grille");
  document.getElementById("vide").style.display = (enMaisons && !n)? "block":"none";
  g.style.display = (enMaisons && n)? "grid":"none";
  document.getElementById("compteur").style.display = enMaisons? "":"none";
  document.getElementById("lblCtrl").parentElement.style.display = enMaisons? "":"none";
  document.getElementById("lblTri").parentElement.style.display = enMaisons? "":"none";
  document.getElementById("lblPays").parentElement.style.display = (fVue==="usecases")? "none":"";
  g.innerHTML = liste.map(m=>{
    const fam = ctrlFamille(m.ctrl)==="Familial";
    return `<article class="maison">
      <div class="ligne1"><span class="annee">${m.annee}</span><span class="pays-tag">${L.pays[m.pays]}</span></div>
      <h2 class="nom">${m.nom}</h2>
      <div class="lieu">${m.ville}${m.gen? " · "+m.gen+" "+L.gen:""}</div>
      ${m.exc? `<div class="exc">${L.exc}</div>`:""}
      <p class="sf">${m.sf}</p>
      <p class="acts">${m.acts}</p>
      <div class="meta">
        <div><span>${L.mCtrl}</span><span class="ctrl${fam?" familial":""}">${m.ctrl}</span></div>
        <div class="age"><span>${L.mAge}</span><b>${NOW-m.annee} ${L.ans}</b></div>
        <div><span>${L.mCA}</span><b>${fmtCA(m.ca)}${m.caNote? " <i style='color:var(--ocre)'>"+m.caNote+"</i>":""}</b></div>
        <div><span>${L.mBrevets}</span><b>${m.brevets}</b></div>
      </div>
      ${detailHTML(m)}
    </article>`;
  }).join("");

  /* Filières */
  document.getElementById("flTitre").textContent = L.flTitre;
  document.getElementById("flIntro").textContent = L.flIntro;
  const fl = FILIERES.filter(f=>{
    if(fPays!=="TOUS" && f.pays!==fPays) return false;
    if(fQ){
      const t=(f.nom+" "+L.pays[f.pays]+" "+f.rest).toLowerCase();
      if(!t.includes(fQ)) return false;
    }
    return true;
  });
  document.getElementById("filieres").style.display = (fVue==="filieres" && fl.length)? "block":"none";
  document.getElementById("flCorps").innerHTML = CATS.map(c=>{
    const rows = fl.filter(f=>f.cat===c);
    if(!rows.length) return "";
    return `<div class="flCat">
      <h3>${L.cats[c]} · ${rows.length}</h3>
      <div class="flHead"><span></span><span>${L.flDebut}</span><span>${L.flRest}</span></div>
      ${rows.map(f=>`<div class="flRow">
        <span class="flNom">${f.nom}<span class="pays-tag">${L.pays[f.pays]}</span></span>
        <span class="flDebut">${f.debut}</span>
        <span class="flRest">${f.rest}</span>
      </div>`).join("")}
    </div>`;
  }).join("");

  /* Savoirs */
  document.getElementById("svTitre").textContent = L.svTitre;
  document.getElementById("svIntro").textContent = L.svIntro;
  const sv = SAVOIRS.filter(f=>{
    if(fPays!=="TOUS" && f.pays!==fPays) return false;
    if(fQ){
      const t=(f.nom+" "+L.pays[f.pays]+" "+f.corpus).toLowerCase();
      if(!t.includes(fQ)) return false;
    }
    return true;
  });
  document.getElementById("savoirs").style.display = (fVue==="savoirs" && sv.length)? "block":"none";
  document.getElementById("svCorps").innerHTML = CATS2.map(c=>{
    const rows = sv.filter(f=>f.cat===c);
    if(!rows.length) return "";
    return `<div class="flCat">
      <h3>${L.cats2[c]} · ${rows.length}</h3>
      <div class="flHead"><span></span><span>${L.flDebut}</span><span>${L.svCorpus}</span></div>
      ${rows.map(f=>`<div class="flRow">
        <span class="flNom">${f.nom}<span class="pays-tag">${L.pays[f.pays]}</span></span>
        <span class="flDebut">${f.debut}</span>
        <span class="flRest">${f.corpus}</span>
      </div>`).join("")}
    </div>`;
  }).join("");

  /* Cas d'usage */
  document.getElementById("ucTitre").textContent = L.ucTitre;
  document.getElementById("ucIntro").textContent = L.ucIntro;
  const uc = USECASES.filter(u=>{
    if(fQ){
      const t=(u.nom+" "+u.desc+" "+u.aut).toLowerCase();
      if(!t.includes(fQ)) return false;
    }
    return true;
  });
  document.getElementById("usecases").style.display = (fVue==="usecases" && uc.length)? "block":"none";
  document.getElementById("ucCorps").innerHTML = CATSU.map(c=>{
    const rows = uc.filter(u=>u.cat===c);
    if(!rows.length) return "";
    return `<div class="flCat">
      <h3>${L.catsU[c]} · ${rows.length}</h3>
      <div class="ucHead"><span></span><span>${L.ucAut}</span><span>${L.ucMeca}</span></div>
      ${rows.map(u=>`<div class="ucRow">
        <span class="ucNom"><b>${u.nom}</b><span>${u.desc}</span></span>
        <span class="ucAut">${u.aut}</span>
        <span class="ucMeca">${u.meca}</span>
      </div>`).join("")}
    </div>`;
  }).join("");
}

document.getElementById("selLang").onchange=e=>{lang=e.target.value;rendre();};
document.getElementById("tri").onchange=e=>{fTri=e.target.value;rendre();};
document.getElementById("q").oninput=e=>{fQ=e.target.value.trim().toLowerCase();rendre();};
rendre();
</script>
